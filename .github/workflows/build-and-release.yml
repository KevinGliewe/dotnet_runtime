name: Build and Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/runtimedl/**'
  pull_request:
    paths:
      - 'src/runtimedl/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            rid: linux-x64
            artifact: runtimedl-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: runtimedl-linux-arm64
          - os: ubuntu-latest
            rid: linux-musl-x64
            artifact: runtimedl-linux-musl-x64
          - os: ubuntu-latest
            rid: linux-musl-arm64
            artifact: runtimedl-linux-musl-arm64
          # Windows
          - os: windows-latest
            rid: win-x64
            artifact: runtimedl-win-x64
          - os: windows-latest
            rid: win-x86
            artifact: runtimedl-win-x86
          - os: windows-latest
            rid: win-arm64
            artifact: runtimedl-win-arm64
          # macOS
          - os: macos-latest
            rid: osx-x64
            artifact: runtimedl-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: runtimedl-osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/runtimedl/runtimedl.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.artifact }}

      - name: Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish/${{ matrix.artifact }}
          tar -czf ../../${{ matrix.artifact }}.tar.gz *

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd publish/${{ matrix.artifact }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact }}.zip

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  integration-test:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: runtimedl-linux-x64
            archive: runtimedl-linux-x64.tar.gz
            platform: linux
            arch: x64
            expected_arch: x64
            dotnet_path: ./test-runtime/linux/x64/dotnet
          - runner: macos-latest
            artifact: runtimedl-osx-arm64
            archive: runtimedl-osx-arm64.tar.gz
            platform: macos
            arch: arm64
            expected_arch: arm64
            dotnet_path: ./test-runtime/macos/arm64/dotnet
          - runner: windows-latest
            artifact: runtimedl-win-x64
            archive: runtimedl-win-x64.zip
            platform: windows
            arch: x64
            expected_arch: x64
            dotnet_path: ./test-runtime/windows/x64/dotnet.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Extract (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bin
          tar -xzf ${{ matrix.archive }} -C bin

      - name: Extract (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Expand-Archive -Path ${{ matrix.archive }} -DestinationPath bin

      - name: Download runtime (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x bin/runtimedl
          ./bin/runtimedl \
            --runtime-type runtime \
            --platform ${{ matrix.platform }} \
            --architecture ${{ matrix.arch }} \
            --version-pattern "^8.0.0" \
            --output ./test-runtime

      - name: Download runtime (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\bin\runtimedl.exe --runtime-type runtime --platform ${{ matrix.platform }} --architecture ${{ matrix.arch }} --version-pattern "^8.0.0" --output ./test-runtime

      - name: Fix dotnet permissions (Unix)
        if: runner.os != 'Windows'
        run: chmod +x "${{ matrix.dotnet_path }}"

      - name: Verify runtime
        shell: bash
        run: |
          echo "=== Checking dotnet binary exists ==="
          ls -la "${{ matrix.dotnet_path }}"

          echo "=== Running dotnet --info ==="
          "${{ matrix.dotnet_path }}" --info

          echo "=== Verifying architecture ==="
          ARCH=$("${{ matrix.dotnet_path }}" --info | grep -i "Architecture:" | head -1 | awk '{print $2}')
          echo "Detected architecture: $ARCH"
          echo "Expected architecture: ${{ matrix.expected_arch }}"
          if [ "$(echo "$ARCH" | tr '[:upper:]' '[:lower:]')" != "${{ matrix.expected_arch }}" ]; then
            echo "ERROR: Architecture mismatch!"
            exit 1
          fi

          echo "=== Verifying runtime is installed ==="
          "${{ matrix.dotnet_path }}" --list-runtimes
          "${{ matrix.dotnet_path }}" --list-runtimes | grep -q "Microsoft.NETCore.App 8.0"
          echo "All verifications passed for ${{ matrix.platform }}/${{ matrix.arch }}"

  release:
    needs: [build, integration-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
