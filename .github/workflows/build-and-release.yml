name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            rid: linux-x64
            artifact: runtimedl-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: runtimedl-linux-arm64
          - os: ubuntu-latest
            rid: linux-musl-x64
            artifact: runtimedl-linux-musl-x64
          - os: ubuntu-latest
            rid: linux-musl-arm64
            artifact: runtimedl-linux-musl-arm64
          # Windows
          - os: windows-latest
            rid: win-x64
            artifact: runtimedl-win-x64
          - os: windows-latest
            rid: win-x86
            artifact: runtimedl-win-x86
          - os: windows-latest
            rid: win-arm64
            artifact: runtimedl-win-arm64
          # macOS
          - os: macos-latest
            rid: osx-x64
            artifact: runtimedl-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: runtimedl-osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/runtimedl/runtimedl.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish/${{ matrix.artifact }}

      - name: Archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish/${{ matrix.artifact }}
          tar -czf ../../${{ matrix.artifact }}.tar.gz *

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd publish/${{ matrix.artifact }}
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.artifact }}.zip

      - name: Upload artifact (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
