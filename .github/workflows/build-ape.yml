name: Build Zen-C APE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup zc-ape toolchain
        run: |
          cd src/zc-runtimedl
          curl -L -o zc-boot.com https://github.com/OEvgeny/zc-ape/releases/download/v0.0.2/zc-boot.com
          chmod +x zc-boot.com
          ./zc-boot.com

      - name: Build APE
        run: |
          cd src/zc-runtimedl
          make

      - name: Register APE loader
        run: |
          sudo cp src/zc-runtimedl/usr/bin/ape-x86_64.elf /usr/bin/ape || true
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register" || true

      - name: Test binary
        run: |
          src/zc-runtimedl/out/runtimedl.com --help
          src/zc-runtimedl/out/runtimedl.com --version
          src/zc-runtimedl/out/runtimedl.com --version-pattern ">8.0.0" --download false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtimedl-ape
          path: src/zc-runtimedl/out/runtimedl.com

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
